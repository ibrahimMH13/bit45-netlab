# Session 2 · mini MDH-Net + a management station. Free images only.
#
#     ┌─────────┐
#     │   nms   │  network management station: SNMP tools,
#     │  .10    │  syslog collector, NTP server. Management network ONLY.
#     └────┬────┘
#          │            mgmt network 172.30.30.0/24 (eth0)
#          ├──────────────────────────┼──────────────────────────┐
#          │ .4                       │ .2                       │ .3
#     ┌────┴────┐                ┌────┴────┐                ┌────┴────┐
#     │   pc1   │ eth1      eth1 │   r1    │ eth2      eth1 │   srv   │
#     │ client  ├────────────────┤ router  ├────────────────┤  nginx  │
#     └─────────┘                └─────────┘                └─────────┘
#     10.1.0.10                10.1.0.1 │ 10.2.0.1           10.2.0.10
#
#   Same network as session 1, with the lab-2 routes already in place.
#   SNMP, rsyslog and chrony are installed but NOT configured: you write
#   the config files in config/<node>/. Each node sees its folder as /etc/lab.
#
#   The first deploy downloads the packages: about one minute.
#
#   sudo containerlab destroy -a                 # stop the session 1 lab first
#   sudo containerlab deploy  -t s02-mgmt.clab.yml
name: mdh

mgmt:
  network: mdh-mgmt
  ipv4-subnet: 172.30.30.0/24

topology:
  defaults:
    kind: linux
    image: ghcr.io/hellt/network-multitool

  nodes:
    nms:
      mgmt-ipv4: 172.30.30.10
      binds:
        - config/nms:/etc/lab
      exec:
        - apk add -q --no-cache net-snmp-tools rsyslog chrony
        - mkdir -p /var/log/remote
    pc1:
      mgmt-ipv4: 172.30.30.4
      exec:
        - ip addr add 10.1.0.10/24 dev eth1
        - ip route add 10.2.0.0/24 via 10.1.0.1
    r1:
      mgmt-ipv4: 172.30.30.2
      binds:
        - config/r1:/etc/lab
      exec:
        - ip addr add 10.1.0.1/24 dev eth1
        - ip addr add 10.2.0.1/24 dev eth2
        - sysctl -w net.ipv4.ip_forward=1
        - apk add -q --no-cache net-snmp rsyslog chrony
    srv:
      mgmt-ipv4: 172.30.30.3
      binds:
        - config/srv:/etc/lab
      exec:
        - ip addr add 10.2.0.10/24 dev eth1
        - ip route add 10.1.0.0/24 via 10.2.0.1
        - nginx
        - apk add -q --no-cache net-snmp rsyslog chrony

  links:
    - endpoints: ["pc1:eth1", "r1:eth1"]
    - endpoints: ["r1:eth2", "srv:eth1"]
