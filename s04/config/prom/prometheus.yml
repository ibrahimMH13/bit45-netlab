global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: portal-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["http://10.2.0.10"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 172.30.30.4:9115

  - job_name: portal-icmp
    metrics_path: /probe
    params:
      module: [icmp]
    static_configs:
      - targets: ["10.2.0.10"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 172.30.30.4:9115

  - job_name: snmp
    metrics_path: /snmp
    params:
      module: [if_mib]
      auth: [public_v2]
    static_configs:
      - targets: ["172.30.30.2", "172.30.30.3"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 172.30.30.20:9116
